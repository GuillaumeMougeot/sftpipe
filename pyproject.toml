[project]
name = "sftpipe"
version = "0.5.0"
description = "Fast parallel SFTP over OpenSSH: pipelined multi-session transfers, listings and server-side hashing"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Guillaume Mougeot", email = "guillaume.mougeot@laposte.net" }]
requires-python = ">=3.12"
dependencies = []
keywords = ["sftp", "ssh", "openssh", "parallel", "transfer", "hash", "checksum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Framework :: AsyncIO",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Networking",
    "Typing :: Typed",
]

[project.urls]
Repository = "https://github.com/GuillaumeMougeot/sftpipe"
Issues = "https://github.com/GuillaumeMougeot/sftpipe/issues"

[project.scripts]
sftpipe = "sftpipe.cli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = ["mypy", "paramiko>=3.4", "pre-commit", "pytest", "pytest-cov", "ruff"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["sftpipe"]
